name: Weekly TCG Portfolio Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 0"

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Update portfolio
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TCGGO_API_KEY: ${{ secrets.TCGGO_API_KEY }}
          TCGGO_API_HOST: cardmarket-api-tcg.p.rapidapi.com
          TCGGO_API_BASE: https://cardmarket-api-tcg.p.rapidapi.com
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: EBAY_US
          EBAY_CATEGORY_ID: "183454"
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          MERCARI_LOOKBACK_DAYS: "365"
        run: python -m app.main
